<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | EverBloom Therapy Center</title>
<link rel="icon" type="image/png" href="assets/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#26495c;
  --navy-deep:#1c3644;
  --blue:#3fa0d8;
  --blue-light:#eaf6fc;
  --yellow:#f2e75a;
  --cream:#fffdf6;
  --ink:#2c3e40;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',Arial,sans-serif;color:var(--ink);line-height:1.6;background:var(--blue-light);}
h1{font-family:'Fraunces',Georgia,serif;color:var(--navy-deep);margin:0;}
.wrap{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 20px;
  background:
    radial-gradient(circle at 12% 18%, rgba(63,160,216,0.24) 0, transparent 55%),
    radial-gradient(circle at 88% 20%, rgba(242,231,90,0.30) 0, transparent 55%),
    var(--blue-light);
}
.wrap img{height:64px;margin-bottom:24px;}
.wrap h1{font-size:34px;margin-bottom:14px;}
.wrap p{max-width:480px;color:#3f5560;font-size:16px;margin:0 auto 30px;}
.btn{display:inline-block;padding:12px 26px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none;background:var(--navy-deep);color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <img src="assets/logo-icon.png" alt="EverBloom Therapy Center">
  <h1>Thank you!</h1>
  <p>Your submission has been received. Our team reviews every message personally and will follow up within one business day.</p>
  <a class="btn" href="/">Back to EverBloom Therapy Center</a>
</div>
</body>
</html>
